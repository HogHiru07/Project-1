<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        header, footer{
            background-color: rgb(25, 23, 23);
            color: white;
            text-align: center;
            padding: 1rem;

        }
        .slidebar{
            background-color:rgb(235, 246, 255);
            padding:1rem;
            border-radius: 5px;
            border:1px solid rgb(116, 116, 116);
            min-height: 300px;
        }
        .content{
            background-color:rgb(197, 222, 245)
        }
    </style>
</head>
<body>
    <header>
        <h1>Trang web bootstrap Grid</h1>
    </header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Giới thiệu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Dịch vụ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Liên hệ</a>
                    </li>
                </ul>
        </div>
    </nav>
    <main class="container my-4">
        <div class="row g-4">

            <aside class="col-md-3 slidebar"> 
                <h4>Slidebar</h4>
                <ul class="list-unstyled">
                    <li><a href="#">Mục 1</a></li>
                    <li><a href="#">Mục 2</a></li>
                    <li><a href="#">Mục 3</a></li>
                    <li><a href="#">Mục 4</a></li>
                </ul>
            </aside>
            <section clas="col-md-6 content">
                <h2>Nội dung chính</h2>
                <p>Đây là phần ghi nội dung chính.......</p>
            </section>
        </div>
        <aside class="col-md-3 slidebar">
            <h4>Sildebar trái</h4>
            <p>Thông tin thêm hoặc quảng cáo</p>
        </aside>
    </main>
    <footer>
        @copyright: CNTT K24L - ICTU
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
