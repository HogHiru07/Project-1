<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu đứng</title>
    <style type="text/css">
        ul.vmenu{
            border-radius: 5px;
            box-shadow: 0px 0px 5px orangered;
            list-style: none;
            width: 200px;
        }
        ul.vmenu>li>a{
            display: block;
            border-bottom: 1px dotted orangered;
            line-height: 30px;
            text-decoration: none;
            font-variant: small-caps;
            color: orangered;
            padding-left: 25px;
            background:url('Anh1.PNG') no-repeat left center;
        }
        ul.vmenu>li>a:hover{
            background:url('Anh2.PNG') no-repeat left center;
            color: red;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <ul class="vmenu">
        <li><a href="1.html">Hàng bán chạy</a></li>

</html>
