<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function rainbowify() {
        let divs = document.getElementsByTagName("div");
        for (let i = 0; i < divs.length; i++) {
          divs[i].style.backgroundColor = divs[i].id;
          divs[i].style.width = "100px";
          divs[i].style.height = "100px";
        }
      }
    </script>
  </head>
  <body>
    <div id="red"></div>
    <div id="orange"></div>
    <div id="yellow"></div>
    <div id="green"></div>
    <div id="blue"></div>
    <div id="indigo"></div>
    <div id="violet"></div>
    <button onclick="rainbowify()">Make me rainbow</button>
  </body>
</html>
