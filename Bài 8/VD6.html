<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>Nhập mật khẩu (ít nhất 6 ký tự):</h3>
    <input type="text" id="myInput" placeholder="Nhập vào đây" />
    <button onclick="kiemTra()">Kiem tra</button>
    <p id="thongbao" style="color: red"></p>
    <script>
      function kiemTra() {
        let text = document.getElementById("myInput").value;
        let tb = document.getElementById("thongbao");
        if (text.length < 6) {
          tb.innerHTML = "Phải nhập ít nhất 6 ký tự!";
        } else {
          tb.innerHTML = "Hợp lệ!";
        }
      }
    </script>
  </body>
</html>
