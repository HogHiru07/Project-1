<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
    <table border="1">
        <tr>
            <th colspan="2" align="center" bgcolor="#97CBFA">biểu mẫu đăng kí hội thảo công nghệ</th>
        </tr>
        <tr bgcolor="#E4F2FD">
            <td><b>Họ tên</b></td>
            <td><input type="text" placeholder="nhập tên của bạn"></td>
        </tr>
        <tr>
            <td><b>Email</b></td>
            <td><input type="email" placeholder="nhập email của bạn"></td>
        </tr>
        <tr bgcolor="#E4F2FD">
            <td>Chủ đề bạn quan tâm</td>
            <td>
                <select>
                    <option>trí tuệ nhân tạo</option>
                    <option>lập trình</option>
                    <option>web development</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>bạn đã tham gia hội thảo trước đây chưa?</td>
            <td>
                <input type="radio" name="thamgia" value="co"> Có
                <input type="radio" name="thamgia" value="khong"> Chưa
            </td>
        </tr>
        <tr bgcolor="#E4F2FD">
            <td>Thời gian bạn có thể tham dự</td>
            <td>
                <input type="checkbox" name="time" value="sang"> Sáng
                <input type="checkbox" name="time" value="chieu"> Chiều 
                <input type="checkbox" name="time" value="toi"> Tối
            </td>
        </tr>
        <tr>
            <td>câu hỏi dành cho diễn giả</td>
            <td><textarea rows="3" cols="40"></textarea></td>
        </tr>
        <tr bgcolor="#97CBFA">
            <td colspan="2" align="center">
                <input type="submit" value="Đăng kí">
            </td>
        </tr>
    </table>
    </form>
</body>
</html>
