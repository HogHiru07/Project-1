<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <table border="1" width="600" align="center">
            <tr>
                <th colspan="2" bgcolor="blue" style="height:50px;">Biểu mẫu đăng ký hội thảo công nghệ</th>
            </tr>
            <tr>
                <td>Họ tên</td>
                <td><input type="text" name="txtHoten" placeholder="Nhập tên của bạn"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="txtemail" placeholder="Nhập email"></td>
            </tr>
            <tr>
                <td>Chủ đề bạn quan tâm</td>
                <td>
                    <select name="select">
                        <option>Trí tuệ nhân tạo</option>
                        <option>Phát triển web</option>
                        <option>An toàn thông tin</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bạn đã tham gia hội thảo trước đây chưa?</td>
                <td>
                    <input type="radio" name="rdThamGia" id="idCo" value="Co"><label for="idCo">Có</label>
                    <input type="radio" name="rdThamGia" id="idChua" value="Chua"><label for="idChua">Chưa</label>
                </td>
            </tr>
            <tr>
                <td>Thời gian bạn có thể tham dự</td>
                <td>
                    <input type="checkbox" name="checkbox" id="chkSang"><label for="idSang">Sáng</label>
                    <input type="checkbox" name="checkbox" id="chkChieu"><label for="idChieu">Chiều</label>
                    <input type="checkbox" name="checkbox" id="chkToi"><label for="idToi">Tối</label>
                </td>
            </tr>
            <tr>
                <td style="vertical-align: top;">Câu hỏi dành cho diễn giả</td>
                <td>
                    <textarea name="txtCauHoi" rows="4" cols="50"></textarea>
                </td>
            </tr>
            <tr>
                <td>Nút đăng ký</td>
                <td colspan="2" style="text-align: center; background-color: #99ccff;">
                    <button type="submit">Đăng ký</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
